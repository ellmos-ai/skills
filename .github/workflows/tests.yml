name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Bytecode compilation check
        run: |
          python -m compileall -q testing skills

      - name: Run test suite
        run: |
          python -m pytest -ra -v

      - name: Check public registry
        run: python build_public_registry.py --check

      - name: Check skills map
        run: python build_skills_map.py --check

      - name: Validate the privacy gate
        env:
          # See skill-validation.yml for why this is safe: with a token, a
          # 200 response is only "public" if the body's own `private` field
          # says so (T-20260926-820252321 round 3).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python testing/privacy_gate.py
