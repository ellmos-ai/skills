name: Skill and privacy validation

on:
  pull_request:
    paths:
      - "skills/**"
      - "testing/skill_tester.py"
      - "testing/test_skill_tester.py"
      - "testing/privacy_gate.py"
      - "testing/test_privacy_gate.py"
      - "testing/test_public_private_boundary.py"
      - "testing/changed_skill_gate.py"
      - "testing/test_changed_skill_gate.py"
      - "testing/test_public_registry.py"
      - "build_public_registry.py"
      - "build_skills_map.py"
      - "registry/components.json"
      - "SKILLS-MAP.md"
      - ".gitignore"
      - ".github/workflows/skill-validation.yml"
  push:
    paths:
      - "skills/**"
      - "testing/skill_tester.py"
      - "testing/test_skill_tester.py"
      - "testing/privacy_gate.py"
      - "testing/test_privacy_gate.py"
      - "testing/test_public_private_boundary.py"
      - "testing/changed_skill_gate.py"
      - "testing/test_changed_skill_gate.py"
      - "testing/test_public_registry.py"
      - "build_public_registry.py"
      - "build_skills_map.py"
      - "registry/components.json"
      - "SKILLS-MAP.md"
      - ".gitignore"
      - ".github/workflows/skill-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-s-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the static gate
        run: python -m unittest testing/test_skill_tester.py testing/test_changed_skill_gate.py testing/test_public_registry.py

      - name: Check public catalog outputs
        run: |
          python build_public_registry.py --check
          python build_skills_map.py --check

      - name: Test the privacy gate
        run: python -m unittest testing/test_privacy_gate.py testing/test_public_private_boundary.py

      - name: Validate the public/private boundary
        env:
          # Raises the repo-link visibility gate's rate limit (60/h
          # unauthenticated per shared runner IP, reached fast enough in
          # practice to degrade the check to warn-only). A 200 response no
          # longer means "public" by itself once a token is present -- the
          # body's own `private` field decides -- so this cannot mask a
          # real private-repo link (T-20260926-820252321 round 3).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python testing/privacy_gate.py

      - name: Validate tracked skills
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python testing/changed_skill_gate.py
