<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="document-id" content="{{DOC_ID}}">
<meta name="document-sha256" content="{{ZERO}}">
<meta name="color-scheme" content="light dark">
<title>{{TITLE}} – Formular</title>
<style>
:root{--bg:#fdfdfb;--fg:#1d1f21;--muted:#5b6168;--line:#d9dcdf;--accent:#1f5fae;--code:#f1f2f4;--head:#eef2f7}
@media (prefers-color-scheme: dark){:root{--bg:#16181b;--fg:#e6e8ea;--muted:#a3a9b0;--line:#33383e;--accent:#7fb2ff;--code:#22262b;--head:#1f242b}}
html{background:var(--bg)}body{background:var(--bg);color:var(--fg);font:16px/1.6 "Segoe UI",system-ui,sans-serif;max-width:60rem;margin:0 auto;padding:1.5rem 16px 4rem}
h1,h2,h3,h4{line-height:1.25;margin-top:2em}h1{font-size:1.9rem;margin-top:.5em}h2{border-bottom:1px solid var(--line);padding-bottom:.3em}
a{color:var(--accent)}code{background:var(--code);padding:.1em .3em;border-radius:4px;font-size:.92em;word-break:break-word}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;margin:1em 0}th,td{border:1px solid var(--line);padding:.4em .6em;vertical-align:top;text-align:left}
th{background:var(--head)}hr{border:0;border-top:2px solid var(--line);margin:2.5em 0}
.toc{background:var(--head);border:1px solid var(--line);border-radius:6px;padding:.6em 1.2em}.toc .toctitle{font-weight:600}
@media print{body{background:#fff;color:#000}.sticky-bar{display:none}}
</style>
<style>
{{CSS}}</style>
</head>
<body>
{{BODY}}
<div class="sticky-bar"><div class="grow"><span class="js-progress">0 von {{N}} beantwortet</span><div class="bar"><i class="js-bar"></i></div></div><button type="button" class="primary js-save">Speichern und abschicken</button></div>
<dialog id="dlg" aria-labelledby="dlg-title"><h3 id="dlg-title" style="margin-top:0"></h3><div id="dlg-body"></div><div id="dlg-buttons"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script type="application/json" id="form-data">
{{DATA_JSON}}
</script>
<script>
{{JS}}</script>
</body>
</html>
