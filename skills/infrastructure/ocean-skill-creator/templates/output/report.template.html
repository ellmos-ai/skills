<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    :root {
      --fg: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --accent: #0284c7;
      --bg-card: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: #ffffff;
      line-height: 1.55;
    }
    main { max-width: 900px; margin: 0 auto; }
    header {
      border-bottom: 2px solid var(--accent);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0 0 0.35rem 0; font-size: 1.75rem; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .summary {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }
    section.content { margin-bottom: 2rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 1rem 0;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }
    th { background: var(--bg-card); }
    footer {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media print {
      @page { size: A4; margin: 16mm; }
      body { padding: 0; font-size: 10.5pt; }
      .summary, tr { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>{{title}}</h1>
      <div class="meta">{{subtitle}} · Stand: {{generated_at}}</div>
    </header>
    <div class="summary">
      <strong>Kurzfassung:</strong> {{summary}}
    </div>
    <section class="content">
      {{body_html}}
    </section>
    <footer>
      {{footer}}
    </footer>
  </main>
</body>
</html>
